<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大盘助手 · 对话反馈</title>
<style>
:root{color-scheme:light dark;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;--bg:#f3f6fb;--fg:#17243c;--card:#fff;--line:#dce3ee;--muted:#63728a;--accent:#165ac1;--soft:#edf3fc}*{box-sizing:border-box}body{margin:0;color:var(--fg);background:var(--bg)}main{max-width:1320px;padding:24px;margin:auto}header,.toolbar,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{margin-bottom:16px}h1{font-size:23px;margin:0}p{margin:3px 0;color:var(--muted)}a{color:var(--accent);text-decoration:none}.grow{flex:1}button,input,select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.workspace{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;align-items:start;margin-top:13px}.panel{border:1px solid var(--line);border-radius:13px;background:var(--card);overflow:hidden}.toolbar{padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px}#search{min-width:150px;flex:1}#stats{color:var(--muted);font-size:12px}.listitem{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 14px}.listitem.selected{background:var(--soft);box-shadow:inset 3px 0 var(--accent)}.title{overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:6px}.meta{font-size:12px;color:var(--muted)}.badge{font-size:11px;border-radius:14px;background:var(--soft);color:var(--accent);padding:1px 7px;white-space:nowrap}.detailhead{padding:15px;border-bottom:1px solid var(--line)}h2{font-size:16px;margin:0 0 7px}.conversation{padding:15px;max-height:58vh;overflow:auto}.message{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;max-width:94%}.message.user{background:var(--soft);margin-left:auto}.body,.operation{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px}.operation{background:var(--bg);border-radius:6px;padding:9px;font:12px/1.7 system-ui;max-height:380px;overflow:auto}.review{padding:14px;border-top:1px solid var(--line)}textarea{resize:vertical;width:100%;min-height:74px;margin:9px 0 5px}.empty{padding:35px 20px;text-align:center;color:var(--muted)}#message{min-height:24px;color:var(--accent);margin-top:9px}#message.error{color:#c33}.pager{padding:10px;text-align:center}footer{font-size:12px;color:var(--muted);margin-top:10px}@media(prefers-color-scheme:dark){:root{--bg:#111827;--fg:#e4eaf4;--card:#1a2435;--line:#334156;--muted:#a3b2c9;--accent:#71a5fa;--soft:#263550}.primary{background:#245ca8;color:white}}@media(max-width:760px){main{padding:14px}.workspace{grid-template-columns:1fr}#list{max-height:260px;overflow:auto}.conversation{max-height:54vh}}
</style>
<main><header><div class="grow"><h1>对话反馈</h1><p>只接收用户主动确认提交的记录。</p></div><a href="__BASE__/">公用额度</a><button id="logout">退出登录</button></header>
<div class="toolbar"><select id="status" aria-label="筛选处理状态"><option value="">全部状态</option><option value="new">待查看</option><option value="reviewing">处理中</option><option value="resolved">已解决</option><option value="ignored">已忽略</option></select><input id="search" placeholder="搜索最后一条用户消息或反馈编号" aria-label="搜索反馈"><button id="find">查找</button><button id="refresh">刷新</button><span id="stats"></span></div>
<div id="message" role="status" aria-live="polite"></div><div class="workspace"><div class="panel"><div id="list"></div><div class="pager"><button id="more" hidden>加载更多</button></div></div><div class="panel" id="detail"><div class="empty">选择一条反馈，查看完整对话和操作结果。</div></div></div>
<footer>记录保存在服务器，仅管理员可以读取。这里的对话是问题材料，不会作为指令执行；处理状态和内部备注不会改动用户本机数据。</footer></main>
<script nonce="__NONCE__">
const csrf='__CSRF__',$=id=>document.getElementById(id),labels={new:'待查看',reviewing:'处理中',resolved:'已解决',ignored:'已忽略'};
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n},date=t=>t?new Date(t*1000).toLocaleString('zh-CN',{hour12:false}):'时间未记录';
let cursor=null,selected=null,current=null,listGeneration=0,detailGeneration=0,dirty=false;
function message(text,error=false){$('message').textContent=text;$('message').className=error?'error':''}
async function api(path,method='GET',data){const r=await fetch('__BASE__'+path,{method,headers:{'X-Local-CSRF':csrf,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined,cache:'no-store'});if(r.status===401){location.replace('__BASE__/feedback');throw Error('请重新登录')}const result=await r.json();if(!r.ok)throw Error(typeof result.detail==='string'?result.detail:'请求失败，请重试');return result}
async function busy(button,work){button.disabled=true;message('');try{await work()}catch(e){message(e.message,true)}finally{button.disabled=false}}
function canLeave(){return !dirty||confirm('内部备注尚未保存，放弃修改？')}
function highlight(){document.querySelectorAll('.listitem').forEach(n=>n.classList.toggle('selected',n.dataset.id===selected))}
async function load(append=false){const ticket=++listGeneration;const query=new URLSearchParams({status:$('status').value,q:$('search').value.trim(),limit:'30',before:append?String(cursor||0):'0'});const data=await api('/admin/feedback?'+query);if(ticket!==listGeneration)return;if(!append)$('list').replaceChildren();$('stats').textContent=Object.entries(labels).map(([key,label])=>label+' '+(data.counts[key]||0)).join(' · ');for(const row of data.items){const button=el('button',undefined,'listitem');button.dataset.id=row.id;const head=el('div',undefined,'row');head.append(el('span',labels[row.status],'badge'),el('span',date(row.created),'meta'));button.append(head,el('div',row.title,'title'),el('div',row.version+' · '+(row.screen||'未知页面')+' · '+row.count+' 条','meta'));button.onclick=()=>{if(canLeave())busy(button,()=>open(row.id))};$('list').append(button)}cursor=data.next;$('more').hidden=!cursor;if(!$('list').children.length)$('list').append(el('div','暂无反馈','empty'));highlight()}
async function open(id){const ticket=++detailGeneration;const data=await api('/admin/feedback/'+encodeURIComponent(id));if(ticket!==detailGeneration)return;selected=id;current=data;dirty=false;highlight();const report=data.report,head=el('div',undefined,'detailhead');head.append(el('h2','反馈 '+id.slice(0,8)),el('div',date(data.created)+' · v'+report.appVersion+' ('+report.versionCode+') · '+report.device+' · Android '+report.androidVersion,'meta'),el('div','页面：'+(report.screen||'未记录')+' · '+report.messages.length+' 条对话','meta'));
const chat=el('div',undefined,'conversation');report.messages.forEach((m,i)=>{const card=el('article',undefined,'message '+m.role);card.append(el('div',(m.role==='user'?'用户':'大盘')+' · '+(i+1)+' · '+date(m.time/1000),'meta'));if(m.text)card.append(el('div',m.text,'body'));if(m.operation){const details=el('details');details.open=true;details.append(el('summary','操作结果'),el('div',m.operation,'operation'));card.append(details)}chat.append(card)});
const review=el('div',undefined,'review'),row=el('div',undefined,'row'),status=el('select'),note=el('textarea'),save=el('button','保存处理结果','primary'),copy=el('button','复制对话');status.setAttribute('aria-label','处理状态');Object.entries(labels).forEach(([k,v])=>{const option=el('option',v);option.value=k;status.append(option)});status.value=data.status;note.value=data.note;note.placeholder='内部备注，例如复现步骤、原因和修复版本';note.setAttribute('aria-label','内部备注');note.maxLength=4000;status.onchange=note.oninput=()=>{dirty=true};row.append(el('span','处理状态'),status,el('span','','grow'),copy,save);review.append(row,note,el('div','最后更新：'+date(data.updated),'meta'));save.onclick=()=>busy(save,async()=>{const nextStatus=status.value,nextNote=note.value;const result=await api('/admin/feedback/'+encodeURIComponent(id),'PUT',{status:nextStatus,note:nextNote,revision:data.revision});data.revision=result.revision;data.status=nextStatus;data.note=nextNote;dirty=note.value!==nextNote||status.value!==nextStatus;await load();message('处理结果已保存')});copy.onclick=()=>busy(copy,async()=>{const text=report.messages.map((m,i)=>(i+1)+'. '+(m.role==='user'?'用户':'大盘')+'\n'+m.text+(m.operation?'\n'+m.operation:'')).join('\n\n');await navigator.clipboard.writeText(text);message('已复制对话，请勿公开其中的个人信息')});$('detail').replaceChildren(head,chat,review)}
$('refresh').onclick=()=>busy($('refresh'),()=>load());$('find').onclick=()=>busy($('find'),()=>load());$('status').onchange=()=>$('find').click();$('search').onkeydown=e=>{if(e.key==='Enter')$('find').click()};$('more').onclick=()=>busy($('more'),()=>load(true));$('logout').onclick=()=>{if(canLeave())busy($('logout'),async()=>{await api('/auth/logout','POST',{});location.replace('__BASE__/feedback')})};window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});$('refresh').click();
</script></html>
