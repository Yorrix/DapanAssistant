<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大盘助手 · 公用额度</title>
<style>
:root{color-scheme:light dark;font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif;--bg:#f3f6fb;--fg:#17243c;--card:#fff;--line:#dce3ee;--muted:#63728a;--blue:#165ac1;--soft:#edf3fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}main{max-width:1100px;margin:auto;padding:26px 22px}header{display:flex;align-items:center;gap:18px;margin-bottom:20px}h1{font-size:25px;margin:0}h2{font-size:17px;margin:0 0 12px}p{margin:6px 0;color:var(--muted)}small{color:var(--muted)}button,input{font:inherit;border-radius:9px}button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:7px 14px}button.primary{color:white;background:var(--blue);border-color:var(--blue)}button:disabled{opacity:.55;cursor:wait}input{border:1px solid var(--line);padding:7px 9px;min-width:0;background:var(--card);color:var(--fg)}section{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:16px}.grow{flex:1}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{padding:13px;background:var(--soft);border-radius:10px}.metric strong{font-size:23px;display:block}.editgrid{display:grid;grid-template-columns:120px repeat(3,minmax(80px,1fr));gap:10px;align-items:center;margin-bottom:10px}.editgrid input{width:100%}.note{font-size:12px}#message{min-height:23px;font-size:13px;color:var(--blue)}#message.error{color:#c33}.user{border-top:1px solid var(--line);padding:15px 0 4px}.user:first-child{border-top:0}.email{font-weight:600;overflow-wrap:anywhere}.user .row{margin-bottom:10px}.usage{font-size:12px;white-space:normal;color:var(--muted)}.badge{background:var(--soft);color:var(--muted);font-size:12px;border-radius:20px;padding:2px 8px}footer{font-size:12px;color:var(--muted);padding:0 3px 25px}@media(prefers-color-scheme:dark){:root{--bg:#111827;--fg:#e4eaf4;--card:#1a2435;--line:#334156;--muted:#a3b2c9;--blue:#3975d7;--soft:#263550}}@media(max-width:600px){main{padding:16px 12px}.editgrid{grid-template-columns:68px repeat(3,minmax(55px,1fr));gap:6px}.summary{gap:6px}.metric strong{font-size:18px}header{align-items:flex-start}h1{font-size:21px}}
</style>
<main><header><div class="grow"><h1>公用 AI 额度</h1><p>按邮箱管理，与二手信息共用账号。</p></div><a href="__BASE__/feedback" style="color:var(--blue)">对话反馈</a><button id="refresh">刷新</button><button id="logout">退出登录</button></header>
<section><h2>全站用量</h2><div id="summary" class="summary"></div><p class="note">已用与正在处理的预留额度合计占用上限；请求完成后按用量结算。</p></section>
<section><div class="row"><h2 class="grow">默认额度</h2><span class="badge">金额 / 元</span></div><div class="editgrid"><span></span><small>每天</small><small>每周</small><small>每月</small><span>每个邮箱</span><input id="day" aria-label="账号每日默认额度" type="number" step="0.01" min="0"><input id="week" aria-label="账号每周默认额度" type="number" step="0.01" min="0"><input id="month" aria-label="账号每月默认额度" type="number" step="0.01" min="0"><span>全站</span><input id="siteDay" aria-label="全站每日额度" type="number" step="0.01" min="0"><input id="siteWeek" aria-label="全站每周额度" type="number" step="0.01" min="0"><input id="siteMonth" aria-label="全站每月额度" type="number" step="0.01" min="0"></div><div class="row"><small class="grow">修改立即生效，已有用量保留。单独设置过的邮箱不受默认额度修改影响。</small><button class="primary" id="save-default">保存默认额度</button></div></section>
<section><div class="row"><h2 class="grow">邮箱额度</h2><input id="search" placeholder="搜索邮箱" aria-label="搜索邮箱"><button id="find">查找</button></div><p id="count" class="note"></p><div id="users"></div></section>
<div id="message" role="status" aria-live="polite"></div><footer>三项账号额度与三项全站额度同时生效，任意一项耗尽即暂停公用服务。0 元表示暂停。每天 00:00、每周一 00:00、每月 1 日 00:00 按北京时间恢复。管理页面仅能在这台电脑打开。</footer></main>
<script nonce="__NONCE__">
const csrf='__CSRF__',names=['day','week','month','siteDay','siteWeek','siteMonth'],periods=['day','week','month'],labels=['每天','每周','每月'];
const $=id=>document.getElementById(id),money=n=>(n/1e6).toLocaleString('zh-CN',{maximumFractionDigits:4}),element=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
function message(text,error=false){$('message').textContent=text;$('message').className=error?'error':''}
async function api(path,method='GET',data){const r=await fetch('__BASE__'+path,{method,headers:{'X-Local-CSRF':csrf,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined,cache:'no-store'});let result;try{result=await r.json()}catch{throw Error('服务器返回异常，请刷新后重试')}if(r.status===401){location.replace('__BASE__/');throw Error('登录已过期，请重新登录')}if(!r.ok)throw Error(typeof result.detail==='string'?result.detail:'保存失败，请检查输入或连接');return result}
$('logout').onclick=()=>busy($('logout'),async()=>{await api('/auth/logout','POST',{});location.replace('__BASE__/')});
function amount(input){const n=Number(input.value);if(input.value.trim()===''||!Number.isFinite(n)||n<0||n>1e6)throw Error('请输入 0 到 1000000 之间的金额');return Math.round(n*1e6)}
async function busy(button,work){button.disabled=true;message('');try{await work()}catch(e){message(e.message,true)}finally{button.disabled=false}}
async function defaults(){const data=await api('/admin/ai/config');names.forEach(k=>$(k).value=data.limits[k]/1e6);$('summary').replaceChildren();['siteDay','siteWeek','siteMonth'].forEach((k,i)=>{const b=data.site[k],card=element('div',undefined,'metric');card.append(element('small',labels[i]),element('strong','¥ '+money(b.used)),element('small','上限 ¥ '+money(b.limit)+' · 预留 ¥ '+money(b.held)));$('summary').append(card)})}
async function users(){const data=await api('/admin/ai/users?q='+encodeURIComponent($('search').value.trim()));$('users').replaceChildren();$('count').textContent=data.users.length?'已显示 '+data.users.length+' 个账号'+(data.users.length===100?'，可搜索缩小范围':''):'没有找到已注册的邮箱';data.users.forEach(user=>{const card=element('div',undefined,'user'),head=element('div',undefined,'row');head.append(element('span',user.email,'email grow'),element('span',user.disabled?'账号已停用':Object.keys(user.overrides).length?'单独额度':'跟随默认','badge'));card.append(head);const grid=element('div',undefined,'editgrid');grid.append(element('small','上限 / 元'));labels.forEach(l=>grid.append(element('small',l)));grid.append(element('span','账号'));const inputs={};periods.forEach(k=>{const input=element('input');input.type='number';input.step='.01';input.min='0';input.value=user.limits[k]/1e6;input.setAttribute('aria-label',user.email+' '+k);inputs[k]=input;grid.append(input)});grid.append(element('small','已用 / 预留'));periods.forEach(k=>grid.append(element('span','¥ '+money(user.usage[k].used)+' / '+money(user.usage[k].held),'usage')));card.append(grid);const actions=element('div',undefined,'row'),info=element('small','保存仅影响这个邮箱；恢复默认不会清除用量。','grow'),reset=element('button','恢复默认'),save=element('button','保存','primary');save.onclick=()=>busy(save,async()=>{const limits={};periods.forEach(k=>limits[k]=amount(inputs[k]));await api('/admin/ai/user','PUT',{email:user.email,limits});await users();message('已保存 '+user.email+' 的额度')});reset.onclick=()=>busy(reset,async()=>{await api('/admin/ai/user','PUT',{email:user.email,limits:{}});await users();message('已恢复 '+user.email+' 的默认额度')});actions.append(info,reset,save);card.append(actions);$('users').append(card)})}
$('save-default').onclick=()=>busy($('save-default'),async()=>{const limits={};names.forEach(k=>limits[k]=amount($(k)));await api('/admin/ai/config','PUT',{limits});await Promise.all([defaults(),users()]);message('默认额度已保存，用量保持不变')});$('find').onclick=()=>busy($('find'),users);$('search').onkeydown=e=>{if(e.key==='Enter')$('find').click()};$('refresh').onclick=()=>busy($('refresh'),()=>Promise.all([defaults(),users()]));$('refresh').click();
</script></html>
