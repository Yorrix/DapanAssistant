<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大盘助手 · 管理员登录</title>
<style>:root{color-scheme:light dark;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif;--bg:#f3f6fb;--card:#fff;--text:#17243c;--muted:#63728a;--line:#dce3ee;--accent:#165ac1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text)}main{width:min(420px,calc(100vw - 32px));background:var(--card);padding:30px;border:1px solid var(--line);border-radius:18px}h1{font-size:24px;margin:0 0 6px}p{color:var(--muted);margin:0 0 20px;font-size:13px}label{display:block;font-size:13px;margin-top:13px}input{display:block;width:100%;padding:10px 12px;margin-top:5px;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:9px}button{width:100%;margin-top:23px;padding:10px;border:0;border-radius:9px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.5}#message{min-height:24px;color:#cf4444;margin:12px 0 0}small{display:block;margin-top:10px;color:var(--muted);font-size:12px}@media(prefers-color-scheme:dark){:root{--bg:#111827;--card:#1a2435;--text:#e4eaf4;--muted:#a3b2c9;--line:#334156;--accent:#3975d7}}</style>
<main><h1 id="title">管理员登录</h1><p id="intro"></p><form id="form"><label>管理员账号<input id="username" name="username" autocomplete="username" maxlength="64" required autofocus></label><label>密码<input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required></label><label id="confirm-label" hidden>确认密码<input id="confirm" type="password" autocomplete="new-password" maxlength="256"></label><button id="submit" type="submit">登录</button><div id="message" role="alert"></div></form><small>仅限这台电脑访问。服务器密钥不会进入网页。</small></main>
<script nonce="__NONCE__">const mode='__MODE__',csrf='__CSRF__',$=id=>document.getElementById(id);if(mode==='setup'){$('title').textContent='设置管理员';$('intro').textContent='只设置这一个管理账号，之后凭账号和密码调整额度。密码至少 12 个字符。';$('password').autocomplete='new-password';$('password').minLength=12;$('confirm-label').hidden=false;$('confirm').required=true;$('submit').textContent='创建管理员'}else{$('intro').textContent='登录后查看用量和修改公用 AI 额度。'}$('form').onsubmit=async e=>{e.preventDefault();$('message').textContent='';if(mode==='setup'&&$('password').value!==$('confirm').value){$('message').textContent='两次密码不一致';return}$('submit').disabled=true;try{const r=await fetch('/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json','X-Local-CSRF':csrf},body:JSON.stringify({username:$('username').value,password:$('password').value,confirmPassword:$('confirm').value}),cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.detail||'登录失败');$('password').value='';$('confirm').value='';location.replace('/')}catch(e){$('message').textContent=e.message}finally{$('submit').disabled=false}};</script></html>
