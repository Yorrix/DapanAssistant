limit_req_zone $binary_remote_addr zone=dapan_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=dapan_connections:10m;
server {
 listen 80;
 server_name 39.105.161.86;
 location ^~ /.well-known/acme-challenge/ { root /var/www/dapan-acme; default_type text/plain; }
 location / { return 308 https://39.105.161.86$request_uri; }
 access_log off;
}
server {
 listen 443 ssl;
 server_name 39.105.161.86;
 ssl_certificate /etc/letsencrypt/live/dapan-ip/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/dapan-ip/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_session_cache shared:DapanTLS:10m;
 server_tokens off;
 client_max_body_size 3m;
 client_body_timeout 15s;
 client_header_timeout 15s;
 keepalive_timeout 30s;
 limit_req zone=dapan_requests burst=30 nodelay;
 limit_req_status 429;
 limit_conn dapan_connections 20;
 access_log off;
 add_header X-Content-Type-Options nosniff always;
 location ^~ /admin/ { return 404; }
 location = /openapi.json { return 404; }
 location = /ai/chat/completions {
  proxy_pass http://127.0.0.1:8765;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 180s;
  proxy_connect_timeout 5s;
  proxy_buffering off;
  proxy_cache off;
 }
 location = /ai/speech {
  proxy_pass http://127.0.0.1:8765;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 100s;
  proxy_send_timeout 100s;
  proxy_connect_timeout 5s;
  proxy_buffering off;
 }
 location ^~ /components/ {
  alias /opt/dapan/components/;
  autoindex off;
  default_type application/octet-stream;
  add_header Cache-Control "public, max-age=31536000, immutable";
  add_header X-Content-Type-Options nosniff always;
  limit_except GET { deny all; }
 }
 location / {
  proxy_pass http://127.0.0.1:8765;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 45s;
  proxy_connect_timeout 5s;
 }
}
